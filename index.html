<!--
THESIS: Kalyani as a contact sheet. The town map is the developing tray; every pin is a frame someone shot, and friends glow on it only by their choice. It refuses the generic white social feed and the neon "find my friends" radar.
OWN-WORLD: Darkroom. True black, film-strip bands with sprocket holes framing photos and the nav, a red safelight accent (#e3262b) for action, green only for "free", amber edge print (frame numbers, film stock) in condensed caps, live grain over everything. Antonio for the wordmark, Barlow (semi/condensed) for UI.
STORY: Open, see the town through classmates' photos, see who is free right now, add friends, post a frame, go ghost in one tap.
FIRST VIEWPORT: Wordmark top-left, search and settings right; filter chips (Friends · Photos · Free now · Ghost) under it; the dark Kalyani map fills the middle with round photo pins and friend avatars labelled "free till 5 pm"; the film-strip nav at the bottom with the red shutter (post) in the middle.
FORM: Pinned darkroom concept (spotted_a_darkroom.png), the user's own pick; no roll. Seed: pinned-by-brief.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
